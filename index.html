<title>行間 Gyokan</title>
<style>
:root{
  --bg:#eceeea; --surface:#f9faf7; --ink:#1b211f; --mute:#69726e; --line:#d3d8d1; --accent:#2a4d7c; --on-accent:#fff;
  --paper:#fcfcf9; --text:#1c1c1a;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --read-font:var(--mincho); --fs:20px; --L:38px; --inl:600px; --blk:600px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
[data-theme=kinari]{--paper:#efe7d3; --text:#3a3023}
[data-theme=sumi]{--bg:#121514; --surface:#1b1f1e; --ink:#dcdad3; --mute:#8a918d; --line:#2c3230; --accent:#9db9df; --on-accent:#10161f; --paper:#161918; --text:#c9c6bd}
[data-font=gothic]{--read-font:var(--gothic)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- home ---------- */
#home{min-height:100%;padding:calc(var(--sat) + 28px) calc(var(--sar) + clamp(20px,5vw,56px)) calc(var(--sab) + 56px) calc(var(--sal) + clamp(20px,5vw,56px));max-width:1240px;margin:0 auto}
.bar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px}
.mark{font-family:var(--mincho);font-size:1.7rem;font-weight:600;letter-spacing:.18em;margin:0}
.add{background:var(--accent);color:var(--on-accent);padding:9px 18px;border-radius:999px;font-size:.9rem;font-weight:600}
.hero{display:block;width:100%;position:relative;height:clamp(250px,38vh,340px);background:var(--paper);color:var(--text);border-radius:6px;overflow:hidden;text-align:start;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(20,30,28,.45)}
.hero-page{position:absolute;inset:0;padding:30px 38px 30px 30px;writing-mode:vertical-rl;font-family:var(--mincho);overflow:hidden;
  -webkit-mask-image:linear-gradient(to left,#000 38%,transparent 88%);mask-image:linear-gradient(to left,#000 38%,transparent 88%)}
.hero-title{font-size:1.55rem;font-weight:600;line-height:1.5;margin:0 0 0 .5em;max-height:100%;overflow:hidden}
.hero-author{font-size:.85rem;margin:0 0 0 2.2em;opacity:.65;padding-top:2.6em}
.hero-text{font-size:1.02rem;line-height:2;margin:0;opacity:.82;height:100%;text-align:justify;line-break:strict}
.hero-go{position:absolute;left:30px;bottom:26px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-family:var(--gothic)}
.hero-pct{font-size:.8rem;opacity:.7;font-variant-numeric:tabular-nums}
.hero-btn{background:var(--accent);color:var(--on-accent);padding:10px 20px;border-radius:999px;font-size:.92rem;font-weight:600}
.shelf-head{display:flex;align-items:baseline;gap:12px;margin:40px 0 18px}
.shelf-head h2{font-family:var(--mincho);font-size:1.15rem;font-weight:600;margin:0;letter-spacing:.1em}
.shelf-head span{font-size:.8rem;color:var(--mute)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:34px 26px;list-style:none;margin:0;padding:0}
.book{position:relative;min-width:0}
.cover{display:block;width:100%;aspect-ratio:5/7;border-radius:3px;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(20,30,28,.18),0 14px 22px -14px rgba(20,30,28,.5);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .plain{position:absolute;inset:0;padding:16px 22px 16px 12px;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:600;font-size:1rem;line-height:1.45;color:var(--text);border-right:7px solid var(--accent);overflow:hidden;text-align:start}
.prog{height:2px;background:var(--line);margin-top:9px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;gap:6px;align-items:flex-start;margin-top:8px}
.meta div{flex:1;min-width:0}
.b-title{font-size:.84rem;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-author{font-size:.75rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{color:var(--mute);width:28px;height:28px;border-radius:50%;font-size:1.1rem;line-height:1;flex:none;margin-top:-3px}
.menu{position:absolute;right:0;bottom:-34px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);padding:4px}
.menu button{display:block;padding:8px 14px;font-size:.85rem;white-space:nowrap;border-radius:5px;color:#a8342f}
[data-theme=sumi] .menu button{color:#e08b84}
.empty{margin:12vh auto 0;max-width:30rem;text-align:center}
.empty p.big{font-family:var(--mincho);font-size:1.5rem;font-weight:600;margin:0 0 10px;letter-spacing:.06em}
.empty p{color:var(--mute);margin:0 0 26px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:50;max-width:88vw}
body.drag #home{outline:2px dashed var(--accent);outline-offset:-14px}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;background:var(--paper);color:var(--text);overflow:hidden;touch-action:none}
#stage{position:absolute;inset:0;display:grid;place-items:center;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#viewport{position:relative;overflow:hidden}
#flow{position:absolute;top:0;font-family:var(--read-font);font-size:var(--fs);line-height:var(--L);color:var(--text);text-align:justify;line-break:strict;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
#flow.v{right:0;height:100%;writing-mode:vertical-rl;text-orientation:mixed}
#flow.h{left:0;width:100%}
#flow *{line-height:inherit;margin:0;padding:0;font-size:inherit;font-weight:inherit;font-style:normal;text-indent:0;border:0}
#flow rt{font-size:.45em;font-weight:400;line-height:1}
#flow h1,#flow h2,#flow h3{font-size:1.2em;font-weight:600;margin-block:var(--L)}
#flow h4,#flow h5,#flow h6,#flow b,#flow strong,#flow .b-bold{font-weight:600}
#flow hr{block-size:var(--L)}
#flow blockquote{margin-inline-start:2em}
#flow li{margin-inline-start:1.5em}
#flow sup,#flow sub{font-size:.6em}
#flow img{max-inline-size:var(--inl);max-block-size:var(--blk)}
#flow img.x-gaiji{inline-size:1em;block-size:1em}
#flow .b-tcy{-webkit-text-combine:horizontal;text-combine-upright:all}
#flow .b-upright{text-orientation:upright}
#flow .b-sideways{text-orientation:sideways}
#flow .b-em-sesame,#flow .b-em-dot,#flow .b-em-sesame-open{-webkit-text-emphasis:sesame;text-emphasis:sesame}
#flow .b-gfont{font-family:var(--gothic)}
#flow .b-mfont{font-family:var(--mincho)}
#flow .b-align-end,#flow .b-align-right{text-align:end}
#flow .b-align-center{text-align:center}
#foot{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 12px);display:flex;justify-content:space-between;padding:0 calc(var(--sar) + 28px) 0 calc(var(--sal) + 28px);font-size:.72rem;color:var(--text);opacity:.42;pointer-events:none;font-variant-numeric:tabular-nums}
#footCh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.chrome{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--paper) 94%,var(--text));color:var(--text);display:flex;align-items:center;gap:6px;transition:opacity .16s,transform .16s;z-index:10}
#rtop{top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px);border-bottom:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
#rbot{bottom:0;padding:12px calc(var(--sar) + 28px) calc(var(--sab) + 14px) calc(var(--sal) + 28px);border-top:1px solid color-mix(in srgb,var(--text) 14%,transparent);flex-direction:column;align-items:stretch;gap:6px}
#reader:not(.ui) .chrome{opacity:0;pointer-events:none}
#reader:not(.ui) #rtop{transform:translateY(-8px)}
#reader:not(.ui) #rbot{transform:translateY(8px)}
#reader.ui #foot{opacity:0}
.chrome button{padding:9px 13px;border-radius:8px;font-size:.92rem;min-height:40px}
#rtitle{flex:1;text-align:center;font-family:var(--mincho);font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#scrub{width:100%;accent-color:var(--accent);margin:0;height:28px}
#scrubInfo{display:flex;justify-content:space-between;gap:16px;font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}
#scrubInfo span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrubInfo span:last-child{white-space:nowrap}
.pop{position:absolute;top:calc(var(--sat) + 62px);right:calc(var(--sar) + 14px);width:min(320px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);padding:8px 16px;z-index:20}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.row:last-child{border-bottom:0}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:.86rem;min-width:44px}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
.seg .sw{width:44px;height:30px;padding:0;border:1px solid var(--line)}
.seg .sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
.sheet{position:absolute;top:0;bottom:0;right:0;width:min(380px,88vw);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 50px -30px rgba(0,0,0,.5);z-index:20;display:flex;flex-direction:column;padding:calc(var(--sat) + 18px) 0 var(--sab)}
.sheet h3{font-family:var(--mincho);font-size:1.05rem;margin:0 22px 10px;letter-spacing:.1em}
.sheet ol{list-style:none;margin:0;padding:0 10px 20px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet li button{display:block;width:100%;text-align:start;padding:11px 12px;border-radius:8px;font-size:.92rem;line-height:1.45}
.sheet li button[aria-current=true]{color:var(--accent);font-weight:600;background:var(--bg)}
::highlight(gy-lookup){background-color:color-mix(in srgb,var(--accent) 26%,transparent)}
#dict{position:absolute;left:0;top:0;width:min(380px,84vw);max-height:min(62vh,520px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -18px rgba(0,0,0,.55);padding:6px 18px 10px;z-index:15;font-size:.92rem;line-height:1.55}
.d-from{font-size:.78rem;color:var(--mute);padding-top:8px}
.d-entry{padding:10px 0 8px;border-bottom:1px solid var(--line)}
.d-entry:last-child{border-bottom:0}
.d-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.d-word{font-family:var(--mincho);font-size:1.5rem;font-weight:600;line-height:1.3}
.d-read{font-size:.95rem;color:var(--mute)}
.d-tag{font-size:.7rem;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 5px;line-height:1.5}
.d-entry ol{margin:6px 0 0;padding-left:1.4em}
.d-entry li{margin:3px 0}
.d-entry li::marker{color:var(--mute);font-size:.8em}
.d-pos{display:block;font-size:.74rem;color:var(--mute)}
.d-part{font-size:.78rem;color:var(--mute);padding-top:10px}
.d-note{padding:12px 0;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.chrome{transition:none}}
</style>
</head>
<body>
<main id="home">
  <div class="bar">
    <h1 class="mark">行間</h1>
    <button class="add" id="addBtn">本を追加</button>
  </div>
  <div id="heroSlot"></div>
  <div id="shelfSlot"></div>
  <input type="file" id="file" accept=".epub,application/epub+zip" multiple hidden>
</main>

<section id="reader" hidden aria-label="読書画面">
  <div id="stage"><div id="viewport"><div id="flow" class="v"></div></div></div>
  <div id="foot"><span id="footCh"></span><span id="footPct"></span></div>
  <header id="rtop" class="chrome">
    <button id="back">‹ 本棚</button>
    <div id="rtitle"></div>
    <button id="tocBtn">目次</button>
    <button id="aaBtn">表示</button>
  </header>
  <footer id="rbot" class="chrome">
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="読書位置">
    <div id="scrubInfo"><span id="siCh"></span><span id="siLeft"></span></div>
  </footer>
  <aside id="toc" class="sheet" hidden><h3>目次</h3><ol id="tocList"></ol></aside>
  <div id="dict" hidden role="dialog" aria-label="辞書"></div>
  <div id="aa" class="pop" hidden>
    <div class="row"><span>文字の大きさ</span><div class="seg"><button data-size="-1" aria-label="小さく">小</button><button data-size="1" aria-label="大きく">大</button></div></div>
    <div class="row"><span>紙の色</span><div class="seg" id="segTheme">
      <button class="sw" data-theme-v="shiro" style="background:#fcfcf9" aria-label="白"></button>
      <button class="sw" data-theme-v="kinari" style="background:#efe7d3" aria-label="生成り"></button>
      <button class="sw" data-theme-v="sumi" style="background:#161918" aria-label="墨"></button></div></div>
    <div class="row"><span>書体</span><div class="seg" id="segFont"><button data-font-v="mincho">明朝</button><button data-font-v="gothic">ゴシック</button></div></div>
    <div class="row"><span>組み方</span><div class="seg" id="segDir"><button data-dir-v="v">縦</button><button data-dir-v="h">横</button></div></div>
  </div>
</section>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(k,v);}for(const c of kids)if(c!=null)e.append(c);return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const PAGE_CHARS=600; // one "page" = 600 characters, independent of font size

/* ---------- storage ---------- */
const DB={db:null,mem:{books:new Map(),content:new Map()},
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('gyokan',1);r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('content',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}catch(e){this.db=null;}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}},
  run(store,mode,fn){if(!this.db)return Promise.resolve(fn(null));return new Promise((res,rej)=>{let out;try{const tx=this.db.transaction(store,mode);const rq=fn(tx.objectStore(store));if(rq)rq.onsuccess=()=>{out=rq.result;};tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error);}catch(e){rej(e);}});},
  get(s,id){return this.run(s,'readonly',o=>o?o.get(id):null).then(v=>this.db?v:this.mem[s].get(id));},
  all(s){return this.run(s,'readonly',o=>o?o.getAll():null).then(v=>this.db?v:[...this.mem[s].values()]);},
  put(s,v){if(!this.db){this.mem[s].set(v.id,v);return Promise.resolve();}return this.run(s,'readwrite',o=>o.put(v));},
  del(s,id){if(!this.db){this.mem[s].delete(id);return Promise.resolve();}return this.run(s,'readwrite',o=>o.delete(id));}
};
const S=Object.assign({size:20,theme:null,font:'mincho'},(()=>{try{return JSON.parse(localStorage.getItem('gyokan.settings'))||{};}catch(e){return {};}})());
if(!S.theme)S.theme=matchMedia('(prefers-color-scheme:dark)').matches?'sumi':'shiro';
function saveSettings(){try{localStorage.setItem('gyokan.settings',JSON.stringify(S));}catch(e){}}
function applySettings(){const d=document.documentElement;d.dataset.theme=S.theme;d.dataset.font=S.font;
  for(const b of document.querySelectorAll('[data-theme-v]'))b.setAttribute('aria-pressed',b.dataset.themeV===S.theme);
  for(const b of document.querySelectorAll('[data-font-v]'))b.setAttribute('aria-pressed',b.dataset.fontV===S.font);}

/* ---------- zip + epub ---------- */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0)throw new Error('EPUBとして読めないファイルです');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const td=new TextDecoder(),files=new Map(),lower=new Map();
  for(let i=0;i<n&&p+46<=u8.length;i++){if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));files.set(name,{method,csize,off});lower.set(name.toLowerCase(),name);p+=46+nl+xl+cl;}

  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.4){const fwd=isV()?dx>0:dx<0;setUi(false);fwd?next():prev();return;}
  if(Math.abs(dx)>10||Math.abs(dy)>10)return;
  if(readerEl.classList.contains('ui')){setUi(false);return;}
  const g=hitChar(e.clientX,e.clientY);if(g!=null&&lookupAt(g))return;
  if(dictOpen()){closeDict();return;}
  // off the words: top and bottom margins bring up the controls, the sides turn the page
  const vr=viewport.getBoundingClientRect(),f=e.clientX/innerWidth;
  if(e.clientY<vr.top||e.clientY>vr.bottom)setUi(true);else if(f<.3)isV()?next():prev();else if(f>.7)isV()?prev():next();else setUi(true);});
stage.addEventListener('pointercancel',()=>{down=null;});

  if(e.key==='ArrowLeft'){v?next():prev();}else if(e.key==='ArrowRight'){v?prev():next();}
  else if(e.key===' '||e.key==='ArrowDown'||e.key==='PageDown'){next();}else if(e.key==='ArrowUp'||e.key==='PageUp'){prev();}
  else if(e.key==='Escape'){if(dictOpen())closeDict();else if(panelsOpen())closePanels();else if(readerEl.classList.contains('ui'))setUi(false);else closeBook();}else return;e.preventDefault();});
$('#back').onclick=closeBook;
$('#tocBtn').onclick=()=>{const t=$('#toc'),was=t.hidden;closePanels();t.hidden=!was;if(was){let cur=null;for(const b of t.querySelectorAll('button')){b.removeAttribute('aria-current');if(+b.dataset.ch<=R.ch)cur=b;}if(cur){cur.setAttribute('aria-current','true');cur.scrollIntoView({block:'center'});}}};
$('#aaBtn').onclick=()=>{const a=$('#aa'),was=a.hidden;closePanels();a.hidden=!was;};

  if(b.dataset.size){S.size=clamp(S.size+ +b.dataset.size*2,14,34);saveSettings();relayout();}
  else if(b.dataset.themeV){S.theme=b.dataset.themeV;saveSettings();applySettings();}

  else if(b.dataset.dirV){const off=currentOff();R.book.vertical=b.dataset.dirV==='v';for(const x of document.querySelectorAll('[data-dir-v]'))x.setAttribute('aria-pressed',x===b);geometry();measure();show(pageOfOffset(off));}});
$('#scrub').addEventListener('change',e=>gotoGlobal(+e.target.value));

addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});

/* ---------- dictionary: offline JMdict + word splitting (no AI) ---------- */
const Dict={state:'idle',ready:null,bytes:null,lines:null,E:0,K:0,tok:null};
const enc=new TextEncoder(),dec=new TextDecoder();
async function gunzip(buf){return new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());}
// big files may be stored whole (name.bin) or in numbered parts (name.0.bin, name.1.bin, …)
const getBin=async u=>{const stem=u.replace(/\.bin$/,''),parts=[];
  for(let i=0;i<40;i++){const r=await fetch(`${stem}.${i}.bin`).catch(()=>null);if(!r||!r.ok)break;parts.push(await r.arrayBuffer());}
  if(parts.length)return new Blob(parts).arrayBuffer();
  const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.arrayBuffer();};
function dictStart(){
  if(Dict.ready)return Dict.ready;Dict.state='loading';
  Dict.ready=(async()=>{
    const [jm,kb]=await Promise.all([getBin('jmdict.bin'),getBin('kuromoji.bin')]);
    const B=await gunzip(jm);let n=0;for(let i=0;i<B.length;i++)if(B[i]===10)n++;
    const L=new Uint32Array(n+1);let k=0;L[k++]=0;for(let i=0;i<B.length;i++)if(B[i]===10)L[k++]=i+1;
    const head=dec.decode(B.subarray(0,L[1]-1)).split(' ');if(head[0]!=='GYOKAN1')throw new Error('辞書の形式が違います');
    Dict.bytes=B;Dict.lines=L;Dict.E=+head[1];Dict.K=+head[2];
    const hl=new DataView(kb).getUint32(0,true),hdr=JSON.parse(dec.decode(new Uint8Array(kb,4,hl))),base=4+hl;
    window.__gyokanDict=async url=>{const p=hdr[url.split('/').pop()];if(!p)throw new Error('missing '+url);return (await gunzip(kb.slice(base+p[0],base+p[0]+p[1]))).buffer;};
    await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='kuromoji.js';sc.onload=res;sc.onerror=()=>rej(new Error('kuromoji.js'));document.head.append(sc);});
    Dict.tok=await new Promise((res,rej)=>kuromoji.builder({dicPath:'dict'}).build((e,t)=>e?rej(e):res(t)));
    Dict.state='ready';
  })().catch(e=>{Dict.state='error';console.error(e);});
  return Dict.ready;
}
// binary search over the sorted key lines; returns entry numbers or null
function dictFind(word){
  if(!Dict.bytes||!word)return null;const q=enc.encode(word),B=Dict.bytes,L=Dict.lines;let lo=Dict.E+1,hi=Dict.E+Dict.K;
  while(lo<=hi){const mid=(lo+hi)>>1;let p=L[mid],i=0,c=0;
    for(;;i++,p++){const a=B[p],ae=a===9,be=i>=q.length;if(ae||be){c=ae&&be?0:(ae?-1:1);break;}if(a!==q[i]){c=a<q[i]?-1:1;break;}}
    if(c===0){const raw=dec.decode(B.subarray(p+1,L[mid+1]-1)).split(','),ids=raw.map(x=>parseInt(x[0]==='~'?x.slice(1):x,36));ids.weak=raw.every(x=>x[0]==='~');return ids;} // weak: the key is only a kana reading of kanji words
    if(c<0)lo=mid+1;else hi=mid-1;}
  return null;
}
function dictEntry(i){const L=Dict.lines,f=dec.decode(Dict.bytes.subarray(L[i+1],L[i+2]-1)).split('\t');
  return {k:f[0]?f[0].split(';'):[],r:f[1].split(';'),common:f[2]==='1',senses:f[3].split('\x1f').map(x=>{const p=x.split('|');return {pos:p[0],misc:p[1],gloss:p.slice(2).join('|')};})};}
const NOWORD=/^[\s　-〿＀-／：-＠［-｀｛-･‐-※─-╿!-\/:-@\[-`{-~0-9０-９]+$/;
const INFL=new Set(['動詞','形容詞','助動詞']);
// may several tokens be joined into this entry? Compound nouns join freely; anything glued with particles must be
// a common word or a set expression; rare/archaic entries and kanji spellings of usually-kana words never join.
const RAREM=/archaic|obscure|obsolete|rare|dated/;
function mergeOk(ids,key,glue){
  for(const i of ids){const en=dictEntry(i);
    if(en.senses.every(x=>RAREM.test(x.misc)))continue;
    if(en.k.includes(key)&&en.senses.every(x=>/usually kana/.test(x.misc)))continue;
    if(glue&&!en.common&&!en.senses.some(x=>/expression|conjunction|particle|adverb/.test(x.pos)))continue;
    return true;}
  return false;
}
// group tokens into dictionary words: longest JMdict match from each token, then attach trailing auxiliaries
function groupTokens(toks,seg,base,out){
  const n=toks.length,P=[];let cur=0;
  for(const t of toks){let s=seg.indexOf(t.surface_form,cur);if(s<0)s=cur;P.push(s);cur=s+t.surface_form.length;}
  const lemma=t=>t.basic_form&&t.basic_form!=='*'?t.basic_form:t.surface_form;
  let i=0;
  while(i<n){const t=toks[i];if(t.pos==='記号'||NOWORD.test(t.surface_form)){i++;continue;}
    let best=null,surf='',allAux=true,glue=false;
    for(let j=i;j<n&&j<i+7;j++){const tj=toks[j];if(j>i&&(tj.pos==='記号'||NOWORD.test(tj.surface_form)))break;
      const a=surf+tj.surface_form,b=surf+lemma(tj),cands=INFL.has(tj.pos)?[b,a]:[a,b];
      // a verb followed only by auxiliaries stays the verb (食べられる → 食べる); joined kana must be a real kana word (は+どう is not 波動)
      if(j>i&&allAux)allAux=tj.pos==='助動詞'||(tj.pos==='動詞'&&(tj.pos_detail_1==='接尾'||tj.pos_detail_1==='非自立'))||(tj.pos==='助詞'&&tj.pos_detail_1==='接続助詞');
      const skip=j>i&&INFL.has(t.pos)&&allAux;
      if(j>i&&(tj.pos==='助詞'||tj.pos==='助動詞'))glue=true;
      if(!skip)for(const c of cands){if(c.length>18)continue;const ids=dictFind(c);if(ids&&(j===i||(!ids.weak&&mergeOk(ids,c,glue||toks[i].pos==='助詞')))){best={j,key:c,ids};break;}}
      surf=a;if(surf.length>18)break;}
    let j=best?best.j:i,last=toks[j];
    if(INFL.has(last.pos))while(j+1<n){const x=toks[j+1];
      if(x.pos==='助動詞'||(x.pos==='動詞'&&x.pos_detail_1==='接尾')||(x.pos==='助詞'&&x.pos_detail_1==='接続助詞'&&/^(て|で|ば|ちゃ|じゃ)$/.test(x.surface_form)))j++;else break;}
    const w={s:base+P[i],e:base+P[j]+toks[j].surface_form.length,key:best?best.key:lemma(t),ids:best?best.ids:null};
    if(best&&best.j>i){w.parts=[];for(let q=i;q<=best.j;q++)w.parts.push([base+P[q],base+P[q]+toks[q].surface_form.length,lemma(toks[q]),toks[q].surface_form]);}
    out.push(w);i=j+1;}
}
async function indexChapter(){
  dictStart();await Dict.ready;if(Dict.state!=='ready'||readerEl.hidden||R.words)return;
  const text=R.text,bounds=[...R.breaks,text.length],words=[];let st=0,t0=performance.now();
  for(const end of bounds){if(end<=st)continue;const seg=text.slice(st,end);
    if(seg.trim())groupTokens(Dict.tok.tokenize(seg),seg,st,words);st=end;
    if(performance.now()-t0>24){await new Promise(r=>setTimeout(r));if(readerEl.hidden||R.text!==text)return;t0=performance.now();}}
  if(R.text===text)R.words=words;
}
function charRect(g){const i=nodeAt(g),nd=R.nodes[i];if(!nd)return null;const m=g-nd.off;if(m<0||m>=nd.len)return null;rg.setStart(nd.n,m);rg.setEnd(nd.n,m+1);const r=rg.getBoundingClientRect();return r.width<1||r.height<1?null:r;}
// which character is under the finger: find the line, then search along it (taps on furigana land on the word beside them)
function hitChar(x,y){
  if(!R.text)return null;const vr=viewport.getBoundingClientRect();if(x<vr.left||x>vr.right||y<vr.top||y>vr.bottom)return null;
  const fr=flow.getBoundingClientRect(),v=isV(),c=v?fr.right-x:y-fr.top,p=R.pages[R.page];if(c<p.s-4||c>p.e+1)return null;
  const ln=R.lines.find(l=>c>=l.a&&c<l.b);if(!ln)return null;
  let lo=firstAtOrAfter(ln.a-1),hi=firstAtOrAfter(ln.b-1)-1;if(centerAt(hi+1)!=null&&centerAt(hi+1)<ln.b-1)hi++;if(hi<lo)return null;
  const q=v?y:x;
  while(lo<hi){const mid=(lo+hi)>>1,r=charRect(mid);if(!r){lo=mid+1;continue;}if((v?r.bottom:r.right)<q)lo=mid+1;else hi=mid;}
  const r=charRect(lo);if(!r)return null;if(q<(v?r.top:r.left)-3||q>(v?r.bottom:r.right)+3)return null;return lo;
}
const dictEl=$('#dict');const dictOpen=()=>!dictEl.hidden;
function closeDict(){if(dictEl.hidden)return;dictEl.hidden=true;try{CSS.highlights&&CSS.highlights.delete('gy-lookup');}catch(e){}}
function rangeOf(s,e){const a=nodeAt(s),b=nodeAt(e-1),r=document.createRange();r.setStart(R.nodes[a].n,s-R.nodes[a].off);r.setEnd(R.nodes[b].n,e-R.nodes[b].off);return r;}
function scanFrom(g){const text=R.text;for(let len=Math.min(14,text.length-g);len>=1;len--){const key=text.slice(g,g+len),ids=dictFind(key);if(ids)return {s:g,e:g+len,key,ids};}return null;}
function entryNode(i,key){const en=dictEntry(i);let word,read;
  if(en.k.includes(key)){word=key;read=en.r.slice(0,3).join('、');}else if(en.r.includes(key)){word=key;read=en.k.slice(0,2).join('、');}else{word=en.k[0]||en.r[0];read=en.k.length?en.r[0]:'';}
  const ol=h('ol');let prev='';
  for(const sn of en.senses.slice(0,8)){const tag=[sn.pos,sn.misc].filter(Boolean).join(', ').replace(/,/g,', ').replace(/ +/g,' ');ol.append(h('li',null,tag&&tag!==prev?h('span',{class:'d-pos'},tag):null,sn.gloss));prev=tag;}
  return h('div',{class:'d-entry'},h('div',{class:'d-head'},h('span',{class:'d-word'},word),read?h('span',{class:'d-read'},read):null,en.common?h('span',{class:'d-tag'},'常用'):null),ol);}
function lookupAt(g){
  const ch=R.text[g];if(!ch||NOWORD.test(ch))return false;
  if(Dict.state==='error'){if(!Dict.told){Dict.told=true;toast('辞書ファイル（jmdict.bin・kuromoji.bin・kuromoji.js）が見つからないため、辞書は使えません',5200);}return false;}
  if(Dict.state!=='ready'){dictStart();showDict(g,g+1,[h('div',{class:'d-note'},'辞書を準備しています…')]);
    Dict.ready.then(()=>{if(dictOpen()&&dictEl.dataset.g==String(g)){closeDict();lookupAt(g);}});return true;}
  let res=null,part=null;
  if(R.words){let lo=0,hi=R.words.length-1;while(lo<=hi){const mid=(lo+hi)>>1,w=R.words[mid];if(g<w.s)hi=mid-1;else if(g>=w.e)lo=mid+1;else{res=w;break;}}
    if(res&&res.parts){const pt=res.parts.find(x=>g>=x[0]&&g<x[1]);if(pt){const ids=dictFind(pt[2])||dictFind(pt[3]);if(ids)part={key:dictFind(pt[2])?pt[2]:pt[3],ids};}}}
  if(!res||!res.ids){const sc=scanFrom(g);if(sc)res=res&&!res.ids?{s:Math.min(res.s,sc.s),e:Math.max(res.e,sc.e),key:sc.key,ids:sc.ids}:sc;}
  if(!res)res={s:g,e:g+1,key:ch,ids:null};
  const kids=[],surface=R.text.slice(res.s,res.e);
  if(res.ids){if(surface!==res.key)kids.push(h('div',{class:'d-from'},surface));for(const i of res.ids.slice(0,4))kids.push(entryNode(i,res.key));
    if(part&&part.key!==res.key){kids.push(h('div',{class:'d-part'},'この部分'));kids.push(entryNode(part.ids[0],part.key));}}
  else kids.push(h('div',{class:'d-note'},`「${surface}」は辞書に見つかりませんでした。`));
  showDict(res.s,res.e,kids);dictEl.dataset.g=g;return true;
}
function showDict(s,e,kids){
  const rgw=rangeOf(s,e);try{if(window.Highlight&&CSS.highlights)CSS.highlights.set('gy-lookup',new Highlight(rgw));}catch(err){}
  const rect=rgw.getClientRects()[0]||rgw.getBoundingClientRect();
  dictEl.textContent='';dictEl.append(...kids);dictEl.hidden=false;dictEl.scrollTop=0;dictEl.dataset.g=s;
  const pw=dictEl.offsetWidth,ph=dictEl.offsetHeight,vw=innerWidth,vh=innerHeight,gap=16;let x,y;
  if(isV()){x=rect.left-gap-pw;if(x<12)x=rect.right+gap;x=clamp(x,12,vw-pw-12);y=clamp(rect.top-10,12,vh-ph-12);}
  else{y=rect.bottom+gap;if(y+ph>vh-12)y=rect.top-gap-ph;y=clamp(y,12,vh-ph-12);x=clamp(rect.left-24,12,vw-pw-12);}
  dictEl.style.left=x+'px';dictEl.style.top=y+'px';
}

  window.__ready=true;})();
