<title>行間 Gyokan</title>
<style>
:root{
  --bg:#eceeea; --surface:#f9faf7; --ink:#1b211f; --mute:#69726e; --line:#d3d8d1; --accent:#2a4d7c; --on-accent:#fff;
  --paper:#fcfcf9; --text:#1c1c1a;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --read-font:var(--mincho); --fs:20px; --L:38px; --inl:600px; --blk:600px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
[data-theme=kinari]{--paper:#efe7d3; --text:#3a3023}
[data-theme=sumi]{--bg:#121514; --surface:#1b1f1e; --ink:#dcdad3; --mute:#8a918d; --line:#2c3230; --accent:#9db9df; --on-accent:#10161f; --paper:#161918; --text:#c9c6bd}
[data-font=gothic]{--read-font:var(--gothic)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- home ---------- */
#home{min-height:100%;padding:calc(var(--sat) + 28px) calc(var(--sar) + clamp(20px,5vw,56px)) calc(var(--sab) + 56px) calc(var(--sal) + clamp(20px,5vw,56px));max-width:1240px;margin:0 auto}
.bar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px}
.mark{font-family:var(--mincho);font-size:1.7rem;font-weight:600;letter-spacing:.18em;margin:0}
.add{background:var(--accent);color:var(--on-accent);padding:9px 18px;border-radius:999px;font-size:.9rem;font-weight:600}
.hero{display:block;width:100%;position:relative;height:clamp(250px,38vh,340px);background:var(--paper);color:var(--text);border-radius:6px;overflow:hidden;text-align:start;box-shadow:0 1px 0 var(--line),0 18px 40px -28px rgba(20,30,28,.45)}
.hero-page{position:absolute;inset:0;padding:30px 38px 30px 30px;writing-mode:vertical-rl;font-family:var(--mincho);overflow:hidden;
  -webkit-mask-image:linear-gradient(to left,#000 38%,transparent 88%);mask-image:linear-gradient(to left,#000 38%,transparent 88%)}
.hero-title{font-size:1.55rem;font-weight:600;line-height:1.5;margin:0 0 0 .5em;max-height:100%;overflow:hidden}
.hero-author{font-size:.85rem;margin:0 0 0 2.2em;opacity:.65;padding-top:2.6em}
.hero-text{font-size:1.02rem;line-height:2;margin:0;opacity:.82;height:100%;text-align:justify;line-break:strict}
.hero-go{position:absolute;left:30px;bottom:26px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-family:var(--gothic)}
.hero-pct{font-size:.8rem;opacity:.7;font-variant-numeric:tabular-nums}
.hero-btn{background:var(--accent);color:var(--on-accent);padding:10px 20px;border-radius:999px;font-size:.92rem;font-weight:600}
.shelf-head{display:flex;align-items:baseline;gap:12px;margin:40px 0 18px}
.shelf-head h2{font-family:var(--mincho);font-size:1.15rem;font-weight:600;margin:0;letter-spacing:.1em}
.shelf-head span{font-size:.8rem;color:var(--mute)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:34px 26px;list-style:none;margin:0;padding:0}
.book{position:relative;min-width:0}
.cover{display:block;width:100%;aspect-ratio:5/7;border-radius:3px;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(20,30,28,.18),0 14px 22px -14px rgba(20,30,28,.5);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .plain{position:absolute;inset:0;padding:16px 22px 16px 12px;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:600;font-size:1rem;line-height:1.45;color:var(--text);border-right:7px solid var(--accent);overflow:hidden;text-align:start}
.prog{height:2px;background:var(--line);margin-top:9px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;gap:6px;align-items:flex-start;margin-top:8px}
.meta div{flex:1;min-width:0}
.b-title{font-size:.84rem;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-author{font-size:.75rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{color:var(--mute);width:28px;height:28px;border-radius:50%;font-size:1.1rem;line-height:1;flex:none;margin-top:-3px}
.menu{position:absolute;right:0;bottom:-34px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);padding:4px}
.menu button{display:block;padding:8px 14px;font-size:.85rem;white-space:nowrap;border-radius:5px;color:#a8342f}
[data-theme=sumi] .menu button{color:#e08b84}
.empty{margin:12vh auto 0;max-width:30rem;text-align:center}
.empty p.big{font-family:var(--mincho);font-size:1.5rem;font-weight:600;margin:0 0 10px;letter-spacing:.06em}
.empty p{color:var(--mute);margin:0 0 26px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 26px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:50;max-width:88vw}
body.drag #home{outline:2px dashed var(--accent);outline-offset:-14px}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;background:var(--paper);color:var(--text);overflow:hidden;touch-action:none}
#stage{position:absolute;inset:0;display:grid;place-items:center;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#viewport{position:relative;overflow:hidden}
#flow{position:absolute;top:0;font-family:var(--read-font);font-size:var(--fs);line-height:var(--L);color:var(--text);text-align:justify;line-break:strict;overflow-wrap:anywhere;-webkit-user-select:none;user-select:none}
#flow.v{right:0;height:100%;writing-mode:vertical-rl;text-orientation:mixed}
#flow.h{left:0;width:100%}
#flow *{line-height:inherit;margin:0;padding:0;font-size:inherit;font-weight:inherit;font-style:normal;text-indent:0;border:0}
#flow rt{font-size:.45em;font-weight:400;line-height:1}
#flow h1,#flow h2,#flow h3{font-size:1.2em;font-weight:600;margin-block:var(--L)}
#flow h4,#flow h5,#flow h6,#flow b,#flow strong,#flow .b-bold{font-weight:600}
#flow hr{block-size:var(--L)}
#flow blockquote{margin-inline-start:2em}
#flow li{margin-inline-start:1.5em}
#flow sup,#flow sub{font-size:.6em}
#flow img{max-inline-size:var(--inl);max-block-size:var(--blk)}
#flow img.x-gaiji{inline-size:1em;block-size:1em}
#flow .b-tcy{-webkit-text-combine:horizontal;text-combine-upright:all}
#flow .b-upright{text-orientation:upright}
#flow .b-sideways{text-orientation:sideways}
#flow .b-em-sesame,#flow .b-em-dot,#flow .b-em-sesame-open{-webkit-text-emphasis:sesame;text-emphasis:sesame}
#flow .b-gfont{font-family:var(--gothic)}
#flow .b-mfont{font-family:var(--mincho)}
#flow .b-align-end,#flow .b-align-right{text-align:end}
#flow .b-align-center{text-align:center}
#foot{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 12px);display:flex;justify-content:space-between;padding:0 calc(var(--sar) + 28px) 0 calc(var(--sal) + 28px);font-size:.72rem;color:var(--text);opacity:.42;pointer-events:none;font-variant-numeric:tabular-nums}
#footCh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.chrome{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--paper) 94%,var(--text));color:var(--text);display:flex;align-items:center;gap:6px;transition:opacity .16s,transform .16s;z-index:10}
#rtop{top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 14px) 8px calc(var(--sal) + 14px);border-bottom:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
#rbot{bottom:0;padding:12px calc(var(--sar) + 28px) calc(var(--sab) + 14px) calc(var(--sal) + 28px);border-top:1px solid color-mix(in srgb,var(--text) 14%,transparent);flex-direction:column;align-items:stretch;gap:6px}
#reader:not(.ui) .chrome{opacity:0;pointer-events:none}
#reader:not(.ui) #rtop{transform:translateY(-8px)}
#reader:not(.ui) #rbot{transform:translateY(8px)}
#reader.ui #foot{opacity:0}
.chrome button{padding:9px 13px;border-radius:8px;font-size:.92rem;min-height:40px}
#rtitle{flex:1;text-align:center;font-family:var(--mincho);font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#scrub{width:100%;accent-color:var(--accent);margin:0;height:28px}
#scrubInfo{display:flex;justify-content:space-between;gap:16px;font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}
#scrubInfo span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrubInfo span:last-child{white-space:nowrap}
.pop{position:absolute;top:calc(var(--sat) + 62px);right:calc(var(--sar) + 14px);width:min(320px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);padding:8px 16px;z-index:20}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.row:last-child{border-bottom:0}
.ic{display:inline-flex;width:18px;height:18px;margin-right:10px;vertical-align:-3px;color:var(--mute);flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row:has(+ .row[hidden]){border-bottom:0}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:.86rem;min-width:44px}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
.seg .sw{width:44px;height:30px;padding:0;border:1px solid var(--line)}
.seg .sw[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
.sheet{position:absolute;top:0;bottom:0;right:0;width:min(380px,88vw);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 50px -30px rgba(0,0,0,.5);z-index:20;display:flex;flex-direction:column;padding:calc(var(--sat) + 18px) 0 var(--sab)}
.sheet h3{font-family:var(--mincho);font-size:1.05rem;margin:0 22px 10px;letter-spacing:.1em}
.sheet ol{list-style:none;margin:0;padding:0 10px 20px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet li button{display:block;width:100%;text-align:start;padding:11px 12px;border-radius:8px;font-size:.92rem;line-height:1.45}
.sheet li button[aria-current=true]{color:var(--accent);font-weight:600;background:var(--bg)}
.bar{gap:18px}
.tabs{display:flex;gap:4px;flex:1;margin-left:14px}
.tabs button{padding:8px 14px;font-size:.98rem;color:var(--mute);border-bottom:2px solid transparent;border-radius:2px}
.tabs button[aria-current=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.simple{display:flex;align-items:center;gap:9px;font-size:.84rem;color:var(--mute);cursor:pointer;white-space:nowrap;align-self:center}
.simple input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.simple input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.simple input:checked{background:var(--accent)}
.simple input:checked::after{transform:translateX(18px)}
.simple:has(input:checked){color:var(--ink);font-weight:600}
.chips{position:relative}
.chips button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.folders{margin-bottom:12px}
.folders .dflt::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:middle}
.folders button{border-radius:8px}
.folders button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips input[type=text]{font:inherit;font-size:.84rem;color:var(--ink);background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;width:11em}
.chips .del{border:0;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.menu input{font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:10.5em;margin:4px}
.menu .lbl{font-size:.72rem;color:var(--mute);padding:6px 14px 2px}
.fav{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--surface) 86%,transparent);color:var(--mute);font-size:1.05rem;line-height:1;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3);z-index:2}
.fav[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.b-folder{font-size:.7rem;color:var(--mute)}
.shelf-hero{margin-bottom:34px}
.day{display:flex;align-items:baseline;gap:12px;margin:4px 0 18px}
.day h2{font-family:var(--mincho);font-size:1.5rem;font-weight:600;margin:0;letter-spacing:.06em}
.day span{color:var(--mute);font-size:.9rem}
/* scroll mode: the text box itself scrolls, sideways for vertical text and downward for horizontal text */
#reader.scrolling{touch-action:auto}
#viewport.scroll{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;clip-path:none!important}
#viewport.scroll::-webkit-scrollbar{display:none}
#viewport.scroll.v{writing-mode:vertical-rl;overflow-y:hidden;touch-action:pan-x}
#viewport.scroll.h{overflow-x:hidden;touch-action:pan-y}
#viewport.scroll #flow{position:static;transform:none!important}
#viewport.scroll #flow.v{height:auto}
#viewport.scroll #flow.h{width:auto}
.chnav{display:none}
#viewport.scroll .chnav:not([hidden]){display:flex;align-items:center;justify-content:center;padding:3em 2.5em;font-family:var(--gothic)}
.chnav button{border:1px solid color-mix(in srgb,var(--text) 30%,transparent);color:var(--text);border-radius:999px;padding:1em .9em;font-size:.9rem;writing-mode:inherit}
#viewport.scroll.h .chnav button{padding:.8em 1.4em}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#notesList{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 22px 20px}
.nt{padding:14px 0;border-bottom:1px solid var(--line)}
.nt-where{font-size:.74rem;color:var(--mute)}
.nt-hand{font-family:var(--mincho);font-size:1.05rem;margin:4px 0 6px;padding-left:10px;border-left:2px solid var(--accent)}
.nt-ai{font-size:.92rem;line-height:1.7}
.nt .acts,.nt-empty{font-size:.82rem;color:var(--mute)}
.nt .acts{display:flex;gap:18px;margin-top:8px}
.nt .acts button{text-decoration:underline;text-underline-offset:3px}
#sheet{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 86%,transparent);display:grid;place-items:center;padding:24px}
#sheet .box{width:min(640px,100%);max-height:80vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:26px 30px 20px;box-shadow:0 30px 60px -24px rgba(0,0,0,.55)}
#sheet h3{font-family:var(--mincho);font-size:1.25rem;margin:0 0 2px;letter-spacing:.06em}
#sheet .from{color:var(--mute);font-size:.82rem;margin-bottom:16px}
#sheet .body{font-family:var(--mincho);font-size:1.12rem;line-height:2;white-space:pre-wrap}
#sheet .foot{display:flex;justify-content:flex-end;margin-top:18px}
.set input[type=text],.set input[type=password]{font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:13em}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:0 0 24px}
.goals .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--mute)}
.goals .lab b{font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.goals .lab b span{font-size:.8rem;color:var(--mute);font-weight:400}
.goals .prog{height:3px;margin-top:7px}
.plan{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid var(--line)}
.plan li{border-bottom:1px solid var(--line)}
.plan button{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;width:100%;padding:14px 4px;text-align:start}
.plan .mini{width:44px;aspect-ratio:5/7;border-radius:2px;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(20,30,28,.25)}
.plan .mini img{width:100%;height:100%;object-fit:cover;display:block}
.plan .t{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.plan .prog{max-width:280px}
.plan .st{font-size:.82rem;color:var(--mute);white-space:nowrap}
.plan .st.done{color:var(--accent);font-weight:600}
.quiet{margin-top:18px;font-size:.82rem;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px}
.chips button{padding:6px 13px;border-radius:999px;border:1px solid var(--line);font-size:.84rem;color:var(--mute)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .gap{flex:1}

</main>

<section id="reader" hidden aria-label="読書画面">

    <div class="row"><span>文字の大きさ</span><div class="seg"><button data-size="-1" aria-label="小さく">小</button><button data-size="1" aria-label="大きく">大</button></div></div>

  </div>
</section>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);for(const k in attrs||{}){const v=attrs[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(k,v);}for(const c of kids)if(c!=null)e.append(c);return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// small line icons that say what each setting is for; matched to a row by the start of its label
const ICONS={'ふりがな':'M4 18h16M6 12h12M9 7h1.5M13.5 7H15','知っている単語':'M5 12.5l4.5 4.5L19 7.5','文字の大きさ':'M3 19L8.5 5L14 19M5 14h7M15 19l3-8l3 8M16.2 16h3.6','書体':'M5 7V5h14v2M12 5v14M9.5 19h5','組み方':'M18 4v16M12 4v16M6 4v9','送り':'M9 8l-4 4l4 4M15 8l4 4l-4 4',
  '手書き':'M4 20l1-4L16 5l3 3L8 19ZM14 7l3 3','このページの手書き':'M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7ZM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8Z',
  '一日のページ数':'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18ZM12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8Z','バックアップ':'M12 4v10M8 10l4 4l4-4M5 18h14','自動同期':'M5 9a7 7 0 0 1 12-3l2 2M19 4v4h-4M19 15a7 7 0 0 1-12 3l-2-2M5 20v-4h4',
  'AI':'M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7ZM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8Z','文字・':'M3 19L8.5 5L14 19M5 14h7M15 19l3-8l3 8M16.2 16h3.6'};
function addIcons(root){for(const lab of root.querySelectorAll('.row > span:first-child')){if(lab.querySelector('.ic'))continue;const t=lab.textContent,k=Object.keys(ICONS).sort((a,b)=>b.length-a.length).find(x=>t.startsWith(x));if(!k)continue;
  const sp=document.createElement('span');sp.className='ic';sp.setAttribute('aria-hidden','true');sp.innerHTML=`<svg viewBox="0 0 24 24"><path d="${ICONS[k]}"/></svg>`;lab.prepend(sp);}}
const PAGE_CHARS=600; // one "page" = 600 characters, independent of font size

/* ---------- storage ---------- */
const DB={db:null,mem:{books:new Map(),content:new Map(),vocab:new Map(),ink:new Map(),notes:new Map(),quotes:new Map(),kv:new Map()},
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('gyokan',6);r.onupgradeneeded=()=>{for(const n of ['books','content','vocab','ink','notes','quotes','kv'])if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}catch(e){this.db=null;}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}},
  run(store,mode,fn){if(!this.db)return Promise.resolve(fn(null));return new Promise((res,rej)=>{let out;try{const tx=this.db.transaction(store,mode);const rq=fn(tx.objectStore(store));if(rq)rq.onsuccess=()=>{out=rq.result;};tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error);}catch(e){rej(e);}});},
  get(s,id){return this.run(s,'readonly',o=>o?o.get(id):null).then(v=>this.db?v:this.mem[s].get(id));},
  all(s){return this.run(s,'readonly',o=>o?o.getAll():null).then(v=>this.db?v:[...this.mem[s].values()]);},
  put(s,v){if(s!=='content')markDirty();if(!this.db){this.mem[s].set(v.id,v);return Promise.resolve();}return this.run(s,'readwrite',o=>o.put(v));},
  del(s,id){if(s!=='content')markDirty();if(!this.db){this.mem[s].delete(id);return Promise.resolve();}return this.run(s,'readwrite',o=>o.delete(id));}
};
const S=Object.assign({size:20,theme:null,font:'mincho',pages:12,simple:false,scroll:false,furi:'auto'},(()=>{try{return JSON.parse(localStorage.getItem('gyokan.settings'))||{};}catch(e){return {};}})());
if(!S.theme)S.theme=matchMedia('(prefers-color-scheme:dark)').matches?'sumi':'shiro';
const LS={get(k,d){try{const v=localStorage.getItem('gyokan.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('gyokan.'+k,JSON.stringify(v));}catch(e){}if(k==='log'||k==='folders')markDirty();}};
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
// a book's position as one number: characters from the start of the book
const bookG=b=>{let g=0;for(let i=0;i<b.pos.ch&&i<b.chapters.length;i++)g+=b.chapters[i].chars;return g+(b.pos.off||0);};
const sameBook=(a,b)=>a.title===b.title&&(a.author||'')===(b.author||'')&&a.total===b.total;
/* known words: furigana is shown only for words that are not in this list */
const Known=new Set();
async function loadKnown(){const r=await DB.get('kv','known');Known.clear();for(const w of (r&&r.words)||[])Known.add(w);}
const saveKnown=()=>DB.put('kv',{id:'known',words:[...Known]});
const furiAuto=()=>S.furi!=='book'&&Known.size>0;
function parseWordList(text){let arr;try{const j=JSON.parse(text);arr=Array.isArray(j)?j:(j&&Array.isArray(j.words)?j.words:null);}catch(e){}
  if(!arr)arr=text.split(/[\r\n,、\t]+/);return arr.map(x=>String(x).trim()).filter(x=>x&&x.length<=30);}
function saveSettings(){try{localStorage.setItem('gyokan.settings',JSON.stringify(S));}catch(e){}markDirty();}
function applySettings(){const d=document.documentElement;S.theme='sumi';d.dataset.theme=S.theme; // always dark
  d.dataset.font=S.font;$('#simpleT').checked=!!S.simple;if(typeof drawInk==='function')drawInk();
  for(const b of document.querySelectorAll('[data-theme-v]'))b.setAttribute('aria-pressed',b.dataset.themeV===S.theme);
  for(const b of document.querySelectorAll('[data-font-v]'))b.setAttribute('aria-pressed',b.dataset.fontV===S.font);}

/* ---------- zip + epub ---------- */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0)throw new Error('EPUBとして読めないファイルです');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const td=new TextDecoder(),files=new Map(),lower=new Map();
  for(let i=0;i<n&&p+46<=u8.length;i++){if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));files.set(name,{method,csize,off});lower.set(name.toLowerCase(),name);p+=46+nl+xl+cl;}
  const find=name=>files.get(name)||files.get(lower.get(String(name).toLowerCase()));
  return {has:n=>!!find(n),
    async bytes(name){const f=find(name);if(!f)return null;const nl=dv.getUint16(f.off+26,true),xl=dv.getUint16(f.off+28,true),st=f.off+30+nl+xl,raw=u8.subarray(st,st+f.csize);
      if(f.method===0)return raw.slice();if(f.method!==8)throw new Error('未対応の圧縮形式です');
      if(typeof DecompressionStream==='undefined')throw new Error('このブラウザでは展開できません（iPadOS 16.4以降が必要）');
      return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());},
    async text(name){const b=await this.bytes(name);return b?new TextDecoder().decode(b):null;}};
}
const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
function resolvePath(base,rel){rel=rel.split('#')[0];try{rel=decodeURIComponent(rel);}catch(e){}
  if(rel.startsWith('/'))return rel.slice(1);const out=[];for(const s of (dirOf(base)+rel).split('/')){if(s==='..')out.pop();else if(s!=='.'&&s!=='')out.push(s);}return out.join('/');}
const parseXml=t=>new DOMParser().parseFromString(t,'application/xml');
const tags=(d,n)=>[...d.getElementsByTagNameNS('*',n)];
const KEEP=new Set('p div span ruby rt rb br h1 h2 h3 h4 h5 h6 em strong b i u s sup sub blockquote hr ul ol li section article aside figure figcaption a small pre code dl dt dd table thead tbody tr td th'.split(' '));
const DROP=new Set('script style head link meta title rp iframe object embed noscript audio video nav form input button textarea select'.split(' '));
function sanitize(node,out,base){
  for(const c of node.childNodes){
    if(c.nodeType===3){let t=c.nodeValue.replace(/[\t\n\r ]+/g,' ');if(t===' '&&/[\n\r]/.test(c.nodeValue))continue;if(t)out.append(t);continue;}
    if(c.nodeType!==1)continue;const t=c.localName.toLowerCase();if(DROP.has(t))continue;
    if(t==='svg'){const im=tags(c,'image')[0];const href=im&&(im.getAttribute('xlink:href')||im.getAttributeNS('http://www.w3.org/1999/xlink','href')||im.getAttribute('href'));
      if(href){const e=document.createElement('img');e.setAttribute('data-res',resolvePath(base,href));out.append(e);}continue;}
    if(t==='img'){const src=c.getAttribute('src');if(src&&!src.startsWith('data:')){const e=document.createElement('img');e.setAttribute('data-res',resolvePath(base,src));if(/gaiji/i.test(c.getAttribute('class')||''))e.className='x-gaiji';out.append(e);}continue;}
    if(!KEEP.has(t)){sanitize(c,out,base);continue;}
    const e=document.createElement(t==='a'?'span':t);const cls=(c.getAttribute('class')||'').trim();
    if(cls)e.className=cls.split(/\s+/).map(x=>'b-'+x).join(' ');const id=c.getAttribute('id');if(id)e.setAttribute('data-id',id);

  const copy=async()=>{const txt=t.slice(R.sel.s,R.sel.e).trim();let ok=false;try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){try{const ta=h('textarea',{style:'position:fixed;opacity:0'});ta.value=txt;document.body.append(ta);ta.select();ok=document.execCommand('copy');ta.remove();}catch(x){}}
    closeSel();toast(ok?'コピーしました':'コピーできませんでした');};
  selEl.append(a>0?h('button',{onclick:()=>showSel(sentBounds(a-1)[0],b)},'前の文も'):null||'',h('button',{class:'go',onclick:copy},'コピー'),h('button',{onclick:async()=>{const sl=R.sel,txt=t.slice(sl.s,sl.e).trim();await DB.put('quotes',{id:'q'+Date.now().toString(36),bookId:R.book.id,book:R.book.title,ch:R.ch,off:sl.s,g:R.before[R.ch]+sl.s,text:txt,added:Date.now()});closeSel();toast('書き抜きに保存しました');}},'保存'),h('button',{onclick:nativeSel},'翻訳・調べる'),b<t.length?h('button',{onclick:()=>showSel(a,sentBounds(b)[1])},'次の文も'):'',h('button',{'aria-label':'閉じる',onclick:closeSel},'×'));
  selEl.style.cssText='';selEl.hidden=false;
  // next to the finger: above it when there is room, otherwise below
  if(R.selAt){const w=selEl.offsetWidth,ht=selEl.offsetHeight,x=clamp(R.selAt[0]-w/2,10,innerWidth-w-10);let y=R.selAt[1]-ht-34;if(y<10)y=R.selAt[1]+34;y=clamp(y,10,innerHeight-ht-10);
    selEl.style.cssText=`left:${x}px;top:${y}px;bottom:auto;transform:none`;}}
function closeDict(){if(dictEl.hidden)return;dictEl.hidden=true;clearHl();}
function rangeOf(s,e){const a=nodeAt(s),b=nodeAt(e-1),r=document.createRange();r.setStart(R.nodes[a].n,s-R.nodes[a].off);r.setEnd(R.nodes[b].n,e-R.nodes[b].off);return r;}
function scanFrom(g){const text=R.text;for(let len=Math.min(14,text.length-g);len>=1;len--){const key=text.slice(g,g+len),ids=dictFind(key);if(ids)return {s:g,e:g+len,key,ids};}return null;}
function entryNode(i,key,ctx){const en=dictEntry(i);let word,read;
  if(en.k.includes(key)){word=key;read=en.r.slice(0,3).join('、');}else if(en.r.includes(key)){word=key;read=en.k.slice(0,2).join('、');}else{word=en.k[0]||en.r[0];read=en.k.length?en.r[0]:'';}
  const ol=h('ol');let prev='';
  for(const sn of en.senses.slice(0,8)){const tag=[sn.pos,sn.misc].filter(Boolean).join(', ').replace(/,/g,', ').replace(/ +/g,' ');ol.append(h('li',null,tag&&tag!==prev?h('span',{class:'d-pos'},tag):null,sn.gloss));prev=tag;}
  let save=null;
  if(ctx){const id=i+':'+key;save=h('button',{class:'d-save','aria-pressed':'false'},'単語帳に追加');
    DB.get('vocab',id).then(v=>{if(v){save.setAttribute('aria-pressed','true');save.textContent='追加済み';}});
    save.onclick=async()=>{if(save.getAttribute('aria-pressed')==='true'){await DB.del('vocab',id);save.setAttribute('aria-pressed','false');save.textContent='単語帳に追加';return;}
      const sn=sentenceAround(ctx.s,ctx.e),kana=en.k.includes(key)||!en.k.length?en.r[0]:en.r.includes(key)?'':en.r[0];
      await DB.put('vocab',{id,entry:i,key,word,read:word===kana?'':kana,gloss:en.senses.slice(0,3).map(x=>x.gloss).join(' / '),sent:sn.text,ws:sn.ws,we:sn.we,bookId:R.book.id,book:R.book.title,ch:R.ch,off:ctx.s,added:Date.now(),due:Date.now(),ivl:0,reps:0});
      save.setAttribute('aria-pressed','true');save.textContent='追加済み';};}
  let acts=null;
  if(ctx){const kn=h('button',{class:'d-save','aria-pressed':String(Known.has(word))},Known.has(word)?'知っている語（外す）':'知っている語にする');
    kn.onclick=async()=>{if(Known.has(word))Known.delete(word);else Known.add(word);await saveKnown();const off=currentOff();closeDict();toast(Known.has(word)?`「${word}」を知っている語にしました`:`「${word}」を知っている語から外しました`);loadChapter(R.ch,{off});};
    acts=h('div',{class:'d-acts'},save,kn);}
  return h('div',{class:'d-entry'},h('div',{class:'d-head'},h('span',{class:'d-word'},word),read?h('span',{class:'d-read'},read):null,en.common?h('span',{class:'d-tag'},'常用'):null),acts,ol);}
// the sentence around a word, for the vocab card
function sentenceAround(s,e){const t=R.text,br=new Set(R.breaks),stop=/[。！？!?]/;let a=s,b=e;
  while(a>0&&s-a<80&&!br.has(a)&&!stop.test(t[a-1]))a--;
  while(b<t.length&&b-e<80&&!br.has(b)){b++;if(stop.test(t[b-1]))break;}
  const raw=t.slice(a,b),lead=raw.length-raw.trimStart().length;return {text:raw.trim(),ws:s-a-lead,we:e-a-lead};}
// one block per kanji in the word: meanings, on and kun readings, stroke count and school grade
function kanjiNode(word){if(!Dict.kanji)return null;const box=h('div',{class:'d-kanji'}),done=new Set();
  for(const ch of word){if(done.has(ch))continue;done.add(ch);const f=Dict.kanji.get(ch);if(!f)continue;
    const g=+f[2],grade=g>=1&&g<=6?`小学${g}年`:g===8?'中学':g===9||g===10?'人名用':'',extra=[f[1]?`${f[1]}画`:'',grade].filter(Boolean).join('　');
    box.append(h('div',{class:'kj'},h('b',null,ch),h('div',{class:'m'},f[6]||''),h('div',{class:'rd'},f[4]?h('span',null,h('i',null,'音'),f[4]+'　'):null,f[5]?h('span',null,h('i',null,'訓'),f[5]):null),h('div',{class:'x'},extra)));
    if(box.children.length>=4)break;}
  return box.children.length?box:null;}
function lookupAt(g){
  const ch=R.text[g];if(!ch||NOWORD.test(ch))return false;
  if(Dict.state==='error'){if(!Dict.told){Dict.told=true;toast('辞書ファイル（jmdict.bin・kuromoji.bin・kuromoji.js）が見つからないため、辞書は使えません',5200);}return false;}
  if(Dict.state!=='ready'){dictStart();showDict(g,g+1,[h('div',{class:'d-note'},'辞書を準備しています…')]);
    Dict.ready.then(()=>{if(dictOpen()&&dictEl.dataset.g==String(g)){closeDict();lookupAt(g);}});return true;}
  let res=null,part=null;
  if(R.words){let lo=0,hi=R.words.length-1;while(lo<=hi){const mid=(lo+hi)>>1,w=R.words[mid];if(g<w.s)hi=mid-1;else if(g>=w.e)lo=mid+1;else{res=w;break;}}
    if(res&&res.parts){const pt=res.parts.find(x=>g>=x[0]&&g<x[1]);if(pt){const ids=dictFind(pt[2])||dictFind(pt[3]);if(ids)part={key:dictFind(pt[2])?pt[2]:pt[3],ids};}}}
  if(!res||!res.ids){const sc=scanFrom(g);if(sc)res=res&&!res.ids?{s:Math.min(res.s,sc.s),e:Math.max(res.e,sc.e),key:sc.key,ids:sc.ids}:sc;}
  if(!res)res={s:g,e:g+1,key:ch,ids:null};
  const kids=[],surface=R.text.slice(res.s,res.e);
  if(res.ids){if(surface!==res.key)kids.push(h('div',{class:'d-from'},surface));for(const i of res.ids.slice(0,4))kids.push(entryNode(i,res.key,{s:res.s,e:res.e}));
    if(part&&part.key!==res.key){kids.push(h('div',{class:'d-part'},'この部分'));kids.push(entryNode(part.ids[0],part.key,{s:res.s,e:res.e}));}
    const kn=kanjiNode(res.key);if(kn)kids.push(kn);}
  else{kids.push(h('div',{class:'d-note'},`「${surface}」は辞書に見つかりませんでした。`));const kn=kanjiNode(surface);if(kn)kids.push(kn);}
  showDict(res.s,res.e,kids);dictEl.dataset.g=g;return true;
}
function showDict(s,e,kids){
  // the word is marked with our own boxes, one per piece of the word (Safari paints the built-in highlight over the whole page)
  closeSel();clearHl();const rects=markRange(s,e),rect=rects[0]||rangeOf(s,e).getBoundingClientRect();
  dictEl.textContent='';dictEl.append(...kids);dictEl.hidden=false;dictEl.scrollTop=0;dictEl.dataset.g=s;
  const pw=dictEl.offsetWidth,ph=dictEl.offsetHeight,vw=innerWidth,vh=innerHeight,gap=16;let x,y;
  if(isV()){x=rect.left-gap-pw;if(x<12)x=rect.right+gap;x=clamp(x,12,vw-pw-12);y=clamp(rect.top-10,12,vh-ph-12);}
  else{y=rect.bottom+gap;if(y+ph>vh-12)y=rect.top-gap-ph;y=clamp(y,12,vh-ph-12);x=clamp(rect.left-24,12,vw-pw-12);}
  dictEl.style.left=x+'px';dictEl.style.top=y+'px';
}

(async()=>{applySettings();addIcons($('#aa'));await DB.open();await loadKnown();
  LS.set('shelf',Object.assign({filter:'all',sort:'recent'},LS.get('shelf',{}),{folder:LS.get('homeFolder','')})); // open the library on the chosen view
  await renderHome();
  if(syncCfg())syncPull().then(got=>{if(got&&readerEl.hidden)renderHome();}).catch(()=>{});
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
  window.__ready=true;})();
</script>
